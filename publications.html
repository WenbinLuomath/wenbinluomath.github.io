<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications - Wenbin Luo</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .publications-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }

        .publication {
            margin-bottom: 1.5em;
            padding-left: 2em;
            text-indent: -2em;
        }

        .year-section {
            display: flex;
            align-items: flex-start;
            margin-top: 1.5em;
            gap: 20px;
        }

        .year-header {
            font-size: 1.5em;
            color: #2c3e50;
            font-weight: bold;
            min-width: 60px;
            text-align: right;
            padding-right: 10px;
            background-color: transparent;
            border: none;
            margin-top: 0;
        }

        .publications-list {
            border-left: 2px solid #3498db;
            padding-left: 20px;
            flex: 1;
        }

        .section-header {
            font-size: 1.8em;
            color: #2c3e50;
            margin: 1.5em 0 1em 0;
            padding-bottom: 0.5em;
        }

        .toggle-abstract {
            color: #7f8c8d;
            font-size: 0.9em;
            text-decoration: none;
            font-style: italic;
        }

        .toggle-abstract:hover {
            text-decoration: underline;
            color: #3498db;
        }

        .abstract-content {
            display: none;
            margin-left: 2em;
            margin-top: 0.5em;
            padding: 0.8em;
            border-left: 3px solid #3498db;
            background-color: #f9f9f9;
            font-size: 0.95em;
            color: #555;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .year-section {
                margin-top: 1.5em;
                text-align: center;
                display: block;
            }
            .year-header {
                position: relative;
                text-align: center;
                margin-bottom: 1em;
                border-bottom: 2px solid #3498db;
                padding-bottom: 0.3em;
            }
            .publications-list {
                border-left: none;
                padding-left: 0;
                margin-left: 0;
                text-align: left;
            }
            .publication {
                text-align: left;
                padding-left: 0;
                margin-left: 0;
                text-indent: 0;
                line-height: 1.6;
            }
            .year-section > * {
                flex: none;
                display: block;
            }
        }

        .title {
            font-weight: bold;
        }
        .journal {
            font-style: italic;
        }
        .author {
            color: #2c3e50;
        }

        /* Co-author homepage link */
        .author a.author-link {
            color: #2c3e50;
            text-decoration: none;
            border-bottom: 1px dotted #95a5a6;
        }
        .author a.author-link:hover {
            color: #3498db;
            border-bottom-color: #3498db;
        }

        .links {
            margin-left: 0.5em;
        }
        .links a {
            color: #3498db;
            text-decoration: none;
            margin-right: 0.5em;
        }
        .links a:last-child {
            margin-right: 0;
        }
        .links a:hover {
            text-decoration: underline;
        }

        #loading {
            text-align: center;
            padding: 2em;
            font-style: italic;
            color: #666;
        }

        #error {
            color: red;
            padding: 1em;
            border: 1px solid red;
            display: none;
            margin: 1em 0;
        }

        .profile-links {
            text-align: center;
            margin: 1em 0 2em 0;
            padding: 1em;
            border-bottom: 1px solid #eee;
        }
        .profile-links a {
            display: inline-flex;
            align-items: center;
            color: #3498db;
            text-decoration: none;
            margin: 0 1em;
            padding: 0.5em 1em;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .profile-links a:hover {
            background-color: #f7f9fc;
            text-decoration: underline;
        }
        .profile-links img {
            height: 20px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="publications.html">Publications</a></li>
                <li><a href="talks.html">Talks</a></li>
                <li><a href="teaching.html">Teaching</a></li>
            </ul>
        </nav>
    </header>

    <main class="publications-container">
        <h1>Publications</h1>
        <div id="loading">Loading publications...</div>
        <div id="error"></div>
        <div id="publications"></div>

        <div class="profile-links">
            <a href="https://mathscinet.ams.org/mathscinet/author?authorId=1621494" target="_blank">
                <img src="https://www.ams.org/favicon.ico" alt="MathSciNet">
                MathSciNet Profile
            </a>
            <a href="https://orcid.org/0000-0003-2388-7188" target="_blank">
                <img src="https://orcid.org/assets/vectors/orcid.logo.icon.svg" alt="ORCID">
                ORCID Profile
            </a>
        </div>
    </main>

    <footer>
        <p>© 2024 Wenbin Luo</p>
        <p>Last updated: 2025-04-30 08:40:01</p>
    </footer>

    <script>
        /* ============================================================
         *  Co-author homepage map
         *  Maintained in homepages.json, e.g.
         *  {
         *    "Zhaobo Han": "https://sites.google.com/sas.upenn.edu/zbtomhan/home",
         *    "Binggang Qu": "https://qubinggang.github.io"
         *  }
         * ============================================================ */
        let homepageMap = {};

        function normalizeName(name) {
            return String(name)
                .replace(/[{}]/g, '')
                .replace(/\s+/g, ' ')
                .trim()
                .toLowerCase();
        }

        function buildHomepageMap(raw) {
            const map = {};
            Object.keys(raw || {}).forEach(name => {
                const url = raw[name];
                if (!url) return;
                map[normalizeName(name)] = url;
            });
            return map;
        }

        async function loadHomepages() {
            try {
                const response = await fetch('homepages.json', { cache: 'no-cache' });
                if (!response.ok) throw new Error('homepages.json not found');
                const raw = await response.json();
                homepageMap = buildHomepageMap(raw);
            } catch (err) {
                console.warn('Could not load homepages.json:', err.message);
                homepageMap = {};
            }
        }

        /* ============================================================
         *  Publication
         * ============================================================ */
        class Publication {
            constructor(entry) {
                this.entry = entry;
            }

            /* Build a link list without any trailing space:
             * links are joined by a single space and the result is
             * only emitted when there is at least one valid link. */
            static buildLinks(links) {
                const valid = (links || []).filter(l => l && l.href);
                if (valid.length === 0) return '';
                const inner = valid
                    .map(l => `<a href="${l.href}" target="_blank">${l.label}</a>`)
                    .join(' ');
                return `<span class="links">[${inner}]</span>`;
            }

            formatAuthors(authorString) {
                if (!authorString) return '';
                return authorString.split(' and ')
                    .map(author => {
                        const parts = author.split(', ');
                        let formattedName;
                        if (parts.length === 2) {
                            formattedName = `${parts[1]} ${parts[0]}`;
                        } else {
                            formattedName = author;
                        }

                        // Bold the site owner
                        const norm = normalizeName(formattedName);
                        if (norm === 'wenbin luo' || norm === 'luo wenbin') {
                            return `<strong>Wenbin Luo</strong>`;
                        }

                        // Co-author with a homepage
                        const url = homepageMap[normalizeName(formattedName)] ||
                                    homepageMap[normalizeName(author)];
                        if (url) {
                            return `<a class="author-link" href="${url}" target="_blank" rel="noopener">${formattedName}</a>`;
                        }

                        return formattedName;
                    })
                    .join(', ');
            }

            toString() {
                const authors = this.formatAuthors(this.entry.author);
                const title = (this.entry.title || '').replace(/[{}]/g, '');
                const year = this.entry.year || '';
                const note = this.entry.note ? ` (${this.entry.note})` : '';
                const type = (this.entry.type || '').toLowerCase();

                let content = '';

                if (type === 'unpublished') {
                    /* ---------- Preprint ---------- */
                    const linksHtml = Publication.buildLinks([
                        { href: this.entry.url, label: 'arXiv' }
                    ]);

                    content = `<div class="publication">` +
                        `<span class="author">${authors}</span>. ` +
                        `"<span class="title">${title}</span>."${note}` +
                        (linksHtml ? ' ' + linksHtml : '');
                } else {
                    /* ---------- Published article ---------- */
                    const journal = this.entry.journal || this.entry.booktitle || '';
                    const volume = this.entry.volume ? `, vol. ${this.entry.volume}` : '';
                    const number = this.entry.number ? `(${this.entry.number})` : '';
                    const pages = this.entry.pages ? `, pp. ${this.entry.pages}` : '';

                    const linksHtml = Publication.buildLinks([
                        { href: this.entry.journal_url, label: 'journal' },
                        { href: this.entry.arxiv,       label: 'arXiv' }
                    ]);

                    content = `<div class="publication">` +
                        `<span class="author">${authors}</span>. ` +
                        `"<span class="title">${title}</span>." ` +
                        `<span class="journal">${journal}</span>${volume}${number}${pages}, ${year}${note}.` +
                        (linksHtml ? ' ' + linksHtml : '');
                }

                /* ---------- Abstract toggle + erratum ---------- */
                const extraLinks = [];
                if (this.entry.abstract) {
                    extraLinks.push(
                        `<a href="#" class="toggle-abstract" data-visible="false">[abstract]</a>`
                    );
                }
                if (this.entry.erratum) {
                    extraLinks.push(
                        `<a href="${this.entry.erratum}" target="_blank">[erratum]</a>`
                    );
                }
                if (extraLinks.length > 0) {
                    content += ` <span class="links">${extraLinks.join(' ')}</span>`;
                }

                content += `</div>`;

                /* ---------- Abstract content (sibling of .publication) ---------- */
                if (this.entry.abstract) {
                    const safeAbstract = this.entry.abstract
                        .replace(/&/g, '&amp;')
                        .replace(/"/g, '&quot;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');

                    content += `<div class="abstract-content" style="display: none;">${safeAbstract}</div>`;
                }

                return content;
            }
        }

        /* ============================================================
         *  BibTeX parser
         * ============================================================ */
        class BibtexParser {
            parse(text) {
                const entries = [];
                const entryRegex = /@(\w+)\s*{\s*([^,]*),([^@]*)/g;
                const fieldRegex = /(\w+)\s*=\s*[{"]([^}"]*)[}"]/g;

                let match;
                while ((match = entryRegex.exec(text)) !== null) {
                    const entry = {
                        type: match[1],
                        key: match[2],
                    };

                    let fieldMatch;
                    const fieldText = match[3];
                    fieldRegex.lastIndex = 0;
                    while ((fieldMatch = fieldRegex.exec(fieldText)) !== null) {
                        entry[fieldMatch[1].toLowerCase()] = fieldMatch[2];
                    }

                    entries.push(entry);
                }

                return entries;
            }
        }

        /* ============================================================
         *  Rendering helpers
         * ============================================================ */
        function groupByYear(publications) {
            const byYear = {};
            publications.forEach(pub => {
                const year = pub.entry.year || 'Unknown Year';
                if (!byYear[year]) {
                    byYear[year] = [];
                }
                byYear[year].push(pub);
            });
            return byYear;
        }

        function generateYearSections(publicationsByYear) {
            const years = Object.keys(publicationsByYear).sort((a, b) => b - a);
            return years.map(year => `
                <div class="year-section">
                    <h2 class="year-header">${year}</h2>
                    <div class="publications-list">
                        ${publicationsByYear[year].map(pub => pub.toString()).join('\n')}
                    </div>
                </div>
            `).join('\n');
        }

        async function loadPublications() {
            try {
                // Load co-author homepages first so names can be linked
                await loadHomepages();

                const response = await fetch('mypublications.bib', { cache: 'no-cache' });
                if (!response.ok) throw new Error('Failed to load BibTeX file');

                const text = await response.text();
                const parser = new BibtexParser();
                const entries = parser.parse(text);

                if (entries.length === 0) {
                    throw new Error('No publications found in the BibTeX file');
                }

                // Separate entries by type
                const articles = entries
                    .filter(entry => entry.type.toLowerCase() === 'article')
                    .map(entry => new Publication(entry));
                const preprints = entries
                    .filter(entry => entry.type.toLowerCase() === 'unpublished')
                    .map(entry => new Publication(entry));

                // Generate HTML
                let html = '';

                if (articles.length > 0) {
                    html += '<h2 class="section-header">Journal Articles</h2>';
                    html += generateYearSections(groupByYear(articles));
                }

                if (preprints.length > 0) {
                    html += '<h2 class="section-header">Preprints</h2>';
                    html += generateYearSections(groupByYear(preprints));
                }

                document.getElementById('publications').innerHTML = html;
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                const errorDiv = document.getElementById('error');
                errorDiv.style.display = 'block';
                errorDiv.textContent =
                    `Error: ${error.message}. Please ensure mypublications.bib exists and is properly formatted.`;
            }
        }

        /* ============================================================
         *  Init
         * ============================================================ */
        document.addEventListener('DOMContentLoaded', () => {
            loadPublications();

            // Delegate click events for abstract toggles
            document.getElementById('publications').addEventListener('click', function (e) {
                if (e.target.classList.contains('toggle-abstract')) {
                    e.preventDefault();

                    const link = e.target;
                    const isVisible = link.getAttribute('data-visible') === 'true';
                    const abstractContent = link.closest('.publication').nextElementSibling;

                    if (abstractContent && abstractContent.classList.contains('abstract-content')) {
                        abstractContent.style.display = isVisible ? 'none' : 'block';
                    }

                    link.setAttribute('data-visible', String(!isVisible));
                }
            });

            // Highlight current page in nav
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('nav ul li a').forEach(link => {
                if (link.getAttribute('href') === currentPage) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
